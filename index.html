<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Tine la barra del navegador del movil del color del fondo, en ambos temas. -->
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<title>Radar de clips</title>
<style>
  :root {
    --fondo: #f6f6f7;
    --tarjeta: #ffffff;
    --borde: #e3e3e6;
    --texto: #1a1a1c;
    --tenue: #6b6b73;
    --acento: #7b3fe4;
    --acento-suave: #f0e9fd;
    --peligro: #b3261e;
    --hecho: #1a7f37;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #131316;
      --tarjeta: #1c1c20;
      --borde: #2e2e34;
      --texto: #ececef;
      --tenue: #9a9aa4;
      --acento: #a97bff;
      --acento-suave: #2a2040;
      --peligro: #ff6b6b;
      --hecho: #3fb950;
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    }
  }
  * { box-sizing: border-box; }
  /* Sin esto, Safari en iOS agranda las fuentes al girar a horizontal. */
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: rgba(123,63,228,.14);
  }
  .envoltorio { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--tenue); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .sub button {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--acento); cursor: pointer; text-decoration: underline;
    touch-action: manipulation;
  }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: #2ea043; display: inline-block; }

  .rejilla {
    display: grid; gap: 18px;
    /* min(290px, 100%) y no 290px pelado: en un movil estrecho (320px de
       ancho) una columna de 290px mas los margenes desborda, y la pagina
       acaba con scroll horizontal. Asi la columna nunca excede la pantalla. */
    grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
  }

  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    overflow: hidden; box-shadow: var(--sombra);
    display: flex; flex-direction: column;
    animation: entrar .22s ease both;
  }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  .tarjeta.saliendo { opacity: 0; transform: scale(.96); transition: .18s ease; }
  /* Un clip ya subido no se esconde: se apaga y se va al final. Esconderlo
     seria peor, porque lo que quieres saber de un vistazo es que ya lo usaste. */
  .tarjeta.publicada { opacity: .5; }
  .tarjeta.publicada:active, .tarjeta.publicada:focus-within { opacity: 1; }

  /* La miniatura entera es un enlace al clip: en el movil es el blanco mas
     facil de acertar con el pulgar, mucho mas que un boton de 13px. */
  .lienzo {
    display: block; position: relative; aspect-ratio: 16 / 9; max-width: 100%;
    background: var(--acento-suave); text-decoration: none;
    touch-action: manipulation;
  }
  .lienzo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .puesto {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
  }
  .sello {
    position: absolute; top: 10px; right: 10px;
    background: var(--hecho); color: #fff;
    font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }
  .velocidad {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    padding: 5px 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 6px;
  }
  /* La velocidad estimada es mas ruidosa que la medida entre dos rondas.
     Se marca en la web igual que se marca en el aviso de Telegram. */
  .velocidad .matiz { font-size: 10.5px; font-weight: 500; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
  .velocidad.estimada { background: rgba(0,0,0,.55); }
  /* La duracion es la que decide si el clip cabe en un Short/Reel/TikTok, asi
     que va en la miniatura y no enterrada entre la letra pequena. */
  .duracion {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }

  .cuerpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .canal { font-size: 12.5px; font-weight: 600; color: var(--acento); display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .canal .juego { color: var(--tenue); font-weight: 500; }
  .titulo {
    font-size: 14px; font-weight: 500; margin: 0; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.7em;
    /* Los titulos de Twitch traen cadenas sin espacios ("asdjjsdjdsjsdj...")
       que sin esto ensanchan la tarjeta y desbordan en pantalla estrecha. */
    overflow-wrap: anywhere;
  }
  .meta { font-size: 12px; color: var(--tenue); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; }

  .acciones { display: flex; gap: 8px; padding-top: 4px; }
  .acciones a, .acciones button {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8px 10px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--borde); text-decoration: none;
    min-height: 40px; white-space: nowrap;
    /* Quita el retardo de 300ms que el movil deja para el doble toque. */
    touch-action: manipulation;
  }
  .abrir { flex: 1; background: var(--acento); border-color: var(--acento); color: #fff; }
  .subido { background: transparent; color: var(--tenue); flex: 0 0 auto; padding: 8px 12px; }
  .subido[aria-pressed="true"] { color: var(--hecho); border-color: var(--hecho); }
  .borrar { background: transparent; color: var(--tenue); flex: 0 0 auto; padding: 8px 12px; }

  /* :hover solo donde hay raton de verdad. En una pantalla tactil el estado
     se queda pegado despues de tocar, y un "Borrar" en rojo fijo asusta. */
  @media (hover: hover) {
    .abrir:hover { filter: brightness(1.08); }
    .subido:hover { color: var(--hecho); border-color: var(--hecho); }
    .borrar:hover { color: var(--peligro); border-color: var(--peligro); }
  }
  /* El equivalente tactil: respuesta inmediata al dedo. */
  .abrir:active { filter: brightness(.93); }
  .subido:active { color: var(--hecho); border-color: var(--hecho); }
  .borrar:active { color: var(--peligro); border-color: var(--peligro); }
  .lienzo:active img { opacity: .88; }

  .aviso { text-align: center; padding: 72px 20px; color: var(--tenue); }
  .aviso h2 { color: var(--texto); font-size: 17px; margin: 0 0 8px; }
  .aviso code { background: var(--acento-suave); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  /* --- Movil ------------------------------------------------------------
     A partir de aqui, los ajustes que solo tienen sentido en pantalla de
     telefono: menos margen muerto, botones que se puedan acertar con el
     pulgar, y respeto por el notch y la barra inferior del iPhone. */
  @media (max-width: 560px) {
    .envoltorio {
      padding-top: 18px;
      /* env(safe-area-inset-*) vale 0 en un movil sin notch, asi que el max()
         deja el margen normal y solo crece donde hace falta. */
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: calc(44px + env(safe-area-inset-bottom));
    }
    header { margin-bottom: 16px; }
    h1 { font-size: 19px; }
    .rejilla { gap: 14px; }

    /* En una sola columna no hay nada con lo que alinear, asi que el hueco
       reservado para la segunda linea del titulo solo estorba. */
    .titulo { min-height: 0; font-size: 14.5px; }
    .meta { font-size: 12.5px; }

    /* 46px de alto: por encima del minimo recomendado para el pulgar. Y mas
       separacion entre los botones, que Borrar no es algo que quieras tocar
       por error. Con tres botones el hueco baja a 10px para que quepan. */
    .acciones { gap: 10px; }
    .acciones a, .acciones button { min-height: 46px; font-size: 14px; }
    .subido, .borrar { padding: 8px 14px; }

    .aviso { padding: 56px 16px; }
  }
</style>
</head>
<body>
<div class="envoltorio">
  <header>
    <h1>Radar de clips</h1>
    <div class="sub" id="sub"><span>Cargando...</span></div>
  </header>
  <main id="salida"><div class="aviso">Cargando...</div></main>
</div>

<script>
(() => {
  "use strict";

  const CLAVE = "clipper.borrados";
  const CLAVE_PUB = "clipper.publicados";
  const TTL_POR_DEFECTO = 24;           // solo si el JSON no trae ttl_horas
  const PENALIZACION_DEFECTO = 0.5;     // idem con penalizacion_estimada
  const REFRESCO_DATOS = 5 * 60 * 1000; // el radar publica una vez por ronda
  const REFRESCO_RELOJ = 60 * 1000;     // para que caduquen sin recargar
  const DIAS_REGISTRO = 90;             // cuanto se guarda lo que ya subiste

  let feed = {
    clips: [], actualizado_en: null,
    ttl_horas: TTL_POR_DEFECTO, penalizacion: PENALIZACION_DEFECTO,
  };

  // --- Almacen local -----------------------------------------------------
  // No hay servidor donde guardar nada: la web es estatica. Todo esto vive en
  // localStorage, asi que no viaja entre el PC y el movil.
  const leer = (clave) => {
    try { return JSON.parse(localStorage.getItem(clave)) || {}; }
    catch (e) { return {}; }
  };
  const guardar = (clave, v) => {
    try { localStorage.setItem(clave, JSON.stringify(v)); } catch (e) {}
  };

  // Los borrados se podan a las 48h: pasado el TTL del feed el clip ya no
  // existe, y recordar que lo borraste deja de servir para nada.
  const podarBorrados = () => {
    const b = leer(CLAVE), corte = Date.now() - 48 * 3600e3;
    let cambio = false;
    for (const id of Object.keys(b)) {
      if (!(Date.parse(b[id]) >= corte)) { delete b[id]; cambio = true; }
    }
    if (cambio) guardar(CLAVE, b);
    return b;
  };

  // El registro de publicados es distinto: no guarda solo el id, guarda la
  // FILA ENTERA. Tiene que sobrevivir a que el clip caduque del feed a las
  // 24h, porque si no el CSV se quedaria siempre vacio.
  const podarPublicados = () => {
    const p = leer(CLAVE_PUB), corte = Date.now() - DIAS_REGISTRO * 24 * 3600e3;
    let cambio = false;
    for (const id of Object.keys(p)) {
      // El `p[id] &&` no sobra: si el localStorage trae basura de una version
      // anterior, sin el la pagina entera se cae con un TypeError.
      if (!(p[id] && Date.parse(p[id].publicado_en) >= corte)) {
        delete p[id];
        cambio = true;
      }
    }
    if (cambio) guardar(CLAVE_PUB, p);
    return p;
  };

  // --- Formato -----------------------------------------------------------
  const miles = (n) => Number(n || 0).toLocaleString("es-ES");
  const duracion = (ms) => {
    const m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60);
    return h + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
  };
  const esc = (s) => {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  };
  // Mismo criterio que digest.puntuacion en el radar: la velocidad estimada
  // no es comparable con la medida, asi que para ORDENAR va penalizada. El
  // numero que se enseña sigue siendo el de verdad.
  const puntuacion = (c) =>
    (c.velocidad || 0) * (c.fuente === "nuevo" ? feed.penalizacion : 1);

  // --- Pintado -----------------------------------------------------------
  function tarjeta(c, puesto, publicados) {
    const ahora = Date.now();
    const estimada = c.fuente === "nuevo";
    const publicada = !!publicados[c.id];
    const caducaEn = Date.parse(c.anadido_en) + feed.ttl_horas * 3600e3 - ahora;
    const edad = ahora - Date.parse(c.creado_en);

    const el = document.createElement("article");
    el.className = "tarjeta" + (publicada ? " publicada" : "");
    el.dataset.id = c.id;
    el.innerHTML = [
      // La miniatura es el enlace principal: en movil se acierta con el pulgar
      // sin apuntar. El boton "Abrir clip" se queda para que quede explicito.
      '<a class="lienzo" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer"',
        ' aria-label="Abrir el clip de ' + esc(c.canal) + '">',
        c.miniatura ? '<img src="' + esc(c.miniatura) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '',
        '<span class="puesto">#' + puesto + '</span>',
        publicada ? '<span class="sello">subido</span>' : '',
        '<span class="velocidad ' + (estimada ? 'estimada' : '') + '">',
          (estimada ? '~' : '') + miles(Math.round(c.velocidad)) + ' v/h',
          '<span class="matiz">' + (estimada ? 'estimada' : 'medida') + '</span>',
        '</span>',
        c.duracion ? '<span class="duracion">' + Math.round(c.duracion) + 's</span>' : '',
      '</a>',
      '<div class="cuerpo">',
        '<div class="canal"><span>' + esc(c.canal) + '</span>',
          c.juego ? '<span class="juego">' + esc(c.juego) + '</span>' : '',
        '</div>',
        '<p class="titulo">' + esc(c.titulo) + '</p>',
        '<div class="meta">',
          '<span>' + miles(c.vistas) + ' vistas</span>',
          '<span>clip de hace ' + duracion(edad) + '</span>',
          '<span>caduca en ' + duracion(caducaEn) + '</span>',
        '</div>',
        '<div class="acciones">',
          '<a class="abrir" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">Abrir clip</a>',
          '<button class="subido" aria-pressed="' + publicada + '" title="Marcar como ya subido a ClipperoTV">',
            (publicada ? 'Subido' : 'Marcar'),
          '</button>',
          '<button class="borrar" title="Quitar de la web">Borrar</button>',
        '</div>',
      '</div>'
    ].join('');

    el.querySelector(".borrar").addEventListener("click", () => {
      const b = leer(CLAVE);
      b[c.id] = new Date().toISOString();
      guardar(CLAVE, b);
      el.classList.add("saliendo");
      setTimeout(pintar, 180);
    });

    el.querySelector(".subido").addEventListener("click", () => {
      const p = leer(CLAVE_PUB);
      if (p[c.id]) {
        delete p[c.id];
      } else {
        // Se copia la fila entera, no el id: es lo que hace que el registro
        // siga existiendo cuando el clip ya haya caducado del feed.
        p[c.id] = {
          publicado_en: new Date().toISOString(),
          canal: c.canal, juego: c.juego || "", titulo: c.titulo, url: c.url,
          duracion: c.duracion || 0, vistas: c.vistas,
          velocidad: c.velocidad, fuente: c.fuente, creado_en: c.creado_en,
        };
      }
      guardar(CLAVE_PUB, p);
      pintar();
    });
    return el;
  }

  // --- El registro, en CSV -----------------------------------------------
  // El radar elige los clips por vistas/hora EN TWITCH. Que eso prediga algo
  // en TikTok o en X no lo sabe nadie todavia. Las cuatro columnas vacias del
  // final son justo para eso: rellenalas a mano y en un mes sabras si la
  // metrica es la correcta o si lo que funciona es otra cosa.
  const COLUMNAS = [
    "publicado_en", "canal", "juego", "duracion_s", "titulo", "url",
    "vistas_twitch", "velocidad_vh", "fuente", "creado_en",
    "views_tiktok", "views_reels", "views_shorts", "views_x",
  ];

  function descargarRegistro() {
    const p = podarPublicados();
    const filas = Object.values(p)
      .sort((a, b) => Date.parse(b.publicado_en) - Date.parse(a.publicado_en))
      .map((r) => [
        r.publicado_en, r.canal, r.juego, r.duracion, r.titulo, r.url,
        r.vistas, r.velocidad, r.fuente, r.creado_en, "", "", "", "",
      ]);
    const celda = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const csv = [COLUMNAS, ...filas].map((f) => f.map(celda).join(",")).join("\r\n");

    // El BOM es para Excel: sin el, abre el CSV en la codificacion del sistema
    // y los acentos salen rotos.
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "clippero-registro-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function enlaceSub(texto, alPulsar) {
    const b = document.createElement("button");
    b.textContent = texto;
    b.addEventListener("click", alPulsar);
    return b;
  }

  function pintar() {
    const salida = document.getElementById("salida");
    const sub = document.getElementById("sub");
    const borrados = podarBorrados();
    const publicados = podarPublicados();
    const ahora = Date.now();

    // Doble filtro de caducidad: el radar poda el JSON en cada ronda, pero
    // una pestana abierta desde ayer tiene que caducarlos por su cuenta.
    const vivos = feed.clips
      .filter((c) => Date.parse(c.anadido_en) + feed.ttl_horas * 3600e3 > ahora)
      // Los ya subidos al final, y dentro de cada grupo por velocidad.
      .sort((a, b) => {
        const pa = publicados[a.id] ? 1 : 0, pb = publicados[b.id] ? 1 : 0;
        return pa - pb || puntuacion(b) - puntuacion(a);
      });
    const visibles = vivos.filter((c) => !borrados[c.id]);
    const ocultos = vivos.length - visibles.length;
    const pendientes = visibles.filter((c) => !publicados[c.id]).length;
    const enRegistro = Object.keys(publicados).length;

    sub.innerHTML = '<span><span class="punto"></span> ' + pendientes + ' sin subir' +
      (visibles.length - pendientes ? ' de ' + visibles.length : '') + '</span>' +
      (feed.actualizado_en
        ? '<span>ultima ronda hace ' + duracion(ahora - Date.parse(feed.actualizado_en)) + '</span>'
        : '');
    if (ocultos) {
      sub.appendChild(enlaceSub(
        "restaurar " + ocultos + " borrado" + (ocultos > 1 ? "s" : ""),
        () => { guardar(CLAVE, {}); pintar(); }
      ));
    }
    if (enRegistro) {
      sub.appendChild(enlaceSub(
        "descargar registro (" + enRegistro + ")", descargarRegistro
      ));
    }

    salida.innerHTML = "";
    if (!visibles.length) {
      salida.innerHTML = vivos.length
        ? '<div class="aviso"><h2>Los has borrado todos</h2><p>Vuelve tras la proxima ronda, o restaura los borrados ahi arriba.</p></div>'
        : '<div class="aviso"><h2>Todavia no hay clips</h2><p>La web se llena cuando el radar termina una ronda.</p></div>';
      return;
    }
    const rejilla = document.createElement("div");
    rejilla.className = "rejilla";
    visibles.forEach((c, i) => rejilla.appendChild(tarjeta(c, i + 1, publicados)));
    salida.appendChild(rejilla);
  }

  // --- Datos -------------------------------------------------------------
  async function cargar() {
    try {
      // Pages cachea con ganas; sin romper la cache verias la ronda de ayer.
      const r = await fetch("clips.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      feed = {
        clips: Array.isArray(d.clips) ? d.clips : [],
        actualizado_en: d.actualizado_en || null,
        ttl_horas: d.ttl_horas || TTL_POR_DEFECTO,
        penalizacion: d.penalizacion_estimada || PENALIZACION_DEFECTO,
      };
      pintar();
    } catch (e) {
      document.getElementById("sub").innerHTML = "";
      document.getElementById("salida").innerHTML =
        '<div class="aviso"><h2>No se pudo leer <code>clips.json</code></h2>' +
        '<p>Si el radar aun no ha publicado ninguna ronda, es lo esperado.</p></div>';
    }
  }

  cargar();
  setInterval(cargar, REFRESCO_DATOS);
  setInterval(pintar, REFRESCO_RELOJ);
  // Al volver a la pestana se recarga: en el movil es el caso normal, porque
  // el navegador congela la pagina en cuanto te vas a otra app.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });
})();
</script>
</body>
</html>
