<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Tine la barra del navegador del movil del color del fondo, en ambos temas. -->
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<title>Radar de clips</title>
<style>
  :root {
    --fondo: #f6f6f7;
    --tarjeta: #ffffff;
    --borde: #e3e3e6;
    --texto: #1a1a1c;
    --tenue: #6b6b73;
    --acento: #7b3fe4;
    --acento-suave: #f0e9fd;
    --peligro: #b3261e;
    --hecho: #1a7f37;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #131316;
      --tarjeta: #1c1c20;
      --borde: #2e2e34;
      --texto: #ececef;
      --tenue: #9a9aa4;
      --acento: #a97bff;
      --acento-suave: #2a2040;
      --peligro: #ff6b6b;
      --hecho: #3fb950;
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    }
  }
  * { box-sizing: border-box; }
  /* Sin esto, cualquier display: flex de una clase gana al atributo hidden. */
  [hidden] { display: none !important; }
  /* Sin esto, Safari en iOS agranda las fuentes al girar a horizontal. */
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: rgba(123,63,228,.14);
  }
  .envoltorio { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--tenue); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .sub button {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--acento); cursor: pointer; text-decoration: underline;
    touch-action: manipulation;
  }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: #2ea043; display: inline-block; }

  .rejilla {
    display: grid; gap: 18px;
    /* min(290px, 100%) y no 290px pelado: en un movil estrecho (320px de
       ancho) una columna de 290px mas los margenes desborda, y la pagina
       acaba con scroll horizontal. Asi la columna nunca excede la pantalla. */
    grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
  }

  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    overflow: hidden; box-shadow: var(--sombra);
    display: flex; flex-direction: column;
    animation: entrar .22s ease both;
  }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  .tarjeta.saliendo { opacity: 0; transform: scale(.96); transition: .18s ease; }
  /* Un clip ya subido no se esconde: se apaga y se va al final. Esconderlo
     seria peor, porque lo que quieres saber de un vistazo es que ya lo usaste. */
  .tarjeta.publicada { opacity: .5; }
  .tarjeta.publicada:active, .tarjeta.publicada:focus-within { opacity: 1; }

  /* La miniatura entera es un enlace al clip: en el movil es el blanco mas
     facil de acertar con el pulgar, mucho mas que un boton de 13px. */
  .lienzo {
    display: block; position: relative; aspect-ratio: 16 / 9; max-width: 100%;
    background: var(--acento-suave); text-decoration: none;
    touch-action: manipulation;
  }
  .lienzo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .puesto {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
  }
  .sello {
    position: absolute; top: 10px; right: 10px;
    background: var(--hecho); color: #fff;
    font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }
  .velocidad {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    padding: 5px 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 6px;
  }
  /* La velocidad estimada es mas ruidosa que la medida entre dos rondas.
     Se marca en la web igual que se marca en el aviso de Telegram. */
  .velocidad .matiz { font-size: 10.5px; font-weight: 500; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
  .velocidad.estimada { background: rgba(0,0,0,.55); }
  /* La duracion es la que decide si el clip cabe en un Short/Reel/TikTok, asi
     que va en la miniatura y no enterrada entre la letra pequena. */
  .duracion {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,.72); color: #fff;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }

  .cuerpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .canal { font-size: 12.5px; font-weight: 600; color: var(--acento); display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .canal .juego { color: var(--tenue); font-weight: 500; }
  .titulo {
    font-size: 14px; font-weight: 500; margin: 0; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.7em;
    /* Los titulos de Twitch traen cadenas sin espacios ("asdjjsdjdsjsdj...")
       que sin esto ensanchan la tarjeta y desbordan en pantalla estrecha. */
    overflow-wrap: anywhere;
  }
  .meta { font-size: 12px; color: var(--tenue); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; }

  .acciones { display: flex; gap: 8px; padding-top: 4px; }
  .acciones a, .acciones button {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8px 10px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--borde); text-decoration: none;
    min-height: 40px; white-space: nowrap;
    /* Quita el retardo de 300ms que el movil deja para el doble toque. */
    touch-action: manipulation;
  }
  .abrir { flex: 1; background: var(--acento); border-color: var(--acento); color: #fff; }
  .subido { background: transparent; color: var(--tenue); flex: 0 0 auto; padding: 8px 12px; }
  .subido[aria-pressed="true"] { color: var(--hecho); border-color: var(--hecho); }
  .borrar { background: transparent; color: var(--tenue); flex: 0 0 auto; padding: 8px 12px; }

  /* :hover solo donde hay raton de verdad. En una pantalla tactil el estado
     se queda pegado despues de tocar, y un "Borrar" en rojo fijo asusta. */
  @media (hover: hover) {
    .abrir:hover { filter: brightness(1.08); }
    .subido:hover { color: var(--hecho); border-color: var(--hecho); }
    .borrar:hover { color: var(--peligro); border-color: var(--peligro); }
  }
  /* El equivalente tactil: respuesta inmediata al dedo. */
  .abrir:active { filter: brightness(.93); }
  .subido:active { color: var(--hecho); border-color: var(--hecho); }
  .borrar:active { color: var(--peligro); border-color: var(--peligro); }
  .lienzo:active img { opacity: .88; }

  /* --- Vertical --------------------------------------------------------
     Todo esto solo existe si el navegador tiene guardado el token de GitHub.
     Un visitante sin token no ve ni el boton ni el panel. */
  .vertical { border-top: 1px dashed var(--borde); padding-top: 10px; margin-top: 2px; }
  .vertical > button, .lanzar, .panel button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 8px; min-height: 40px; padding: 8px 12px;
    border: 1px solid var(--acento); background: var(--acento-suave); color: var(--acento);
    touch-action: manipulation;
  }
  .vertical > button { width: 100%; }
  .formulario { display: flex; flex-direction: column; gap: 8px; }
  .formulario .fila { display: flex; gap: 8px; }
  .formulario .fila > * { flex: 1; }
  .panel input, .panel select, .formulario input, .formulario select {
    font: inherit; font-size: 14px; min-height: 40px; padding: 8px 10px; width: 100%;
    border: 1px solid var(--borde); border-radius: 8px;
    background: var(--fondo); color: var(--texto);
  }
  .lanzar { background: var(--acento); color: #fff; }
  .secundario { background: transparent !important; color: var(--tenue) !important; border-color: var(--borde) !important; }
  .estado { font-size: 13px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .estado a { color: var(--acento); }
  .estado.bien { color: var(--hecho); }
  .estado.mal { color: var(--peligro); }
  .estado.curso { color: var(--acento); }

  .panel {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    box-shadow: var(--sombra); padding: 14px; margin-bottom: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel h2 { font-size: 15px; margin: 0; }
  .panel p { margin: 0; font-size: 13px; color: var(--tenue); }
  .panel .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel .fila > input { flex: 1 1 220px; width: auto; }
  .trabajos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .trabajos li { font-size: 13px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .trabajos .nombre { color: var(--tenue); overflow-wrap: anywhere; }

  .aviso { text-align: center; padding: 72px 20px; color: var(--tenue); }
  .aviso h2 { color: var(--texto); font-size: 17px; margin: 0 0 8px; }
  .aviso code { background: var(--acento-suave); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  /* --- Movil ------------------------------------------------------------
     A partir de aqui, los ajustes que solo tienen sentido en pantalla de
     telefono: menos margen muerto, botones que se puedan acertar con el
     pulgar, y respeto por el notch y la barra inferior del iPhone. */
  @media (max-width: 560px) {
    .envoltorio {
      padding-top: 18px;
      /* env(safe-area-inset-*) vale 0 en un movil sin notch, asi que el max()
         deja el margen normal y solo crece donde hace falta. */
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: calc(44px + env(safe-area-inset-bottom));
    }
    header { margin-bottom: 16px; }
    h1 { font-size: 19px; }
    .rejilla { gap: 14px; }

    /* En una sola columna no hay nada con lo que alinear, asi que el hueco
       reservado para la segunda linea del titulo solo estorba. */
    .titulo { min-height: 0; font-size: 14.5px; }
    .meta { font-size: 12.5px; }

    /* 46px de alto: por encima del minimo recomendado para el pulgar. Y mas
       separacion entre los botones, que Borrar no es algo que quieras tocar
       por error. Con tres botones el hueco baja a 10px para que quepan. */
    .acciones { gap: 10px; }
    .acciones a, .acciones button { min-height: 46px; font-size: 14px; }
    .subido, .borrar { padding: 8px 14px; }

    .aviso { padding: 56px 16px; }
  }
</style>
</head>
<body>
<div class="envoltorio">
  <header>
    <h1>Radar de clips</h1>
    <div class="sub" id="sub"><span>Cargando...</span></div>
  </header>
  <!-- Se rellenan desde el script, y solo con el token guardado (o con
       #ajustes en la URL para meterlo). Fuera de pintar() a proposito: si se
       repintaran cada minuto, se borraria lo que estes escribiendo. -->
  <section id="ajustes" class="panel" hidden></section>
  <section id="lanzador" class="panel" hidden></section>
  <main id="salida"><div class="aviso">Cargando...</div></main>
</div>

<script>
(() => {
  "use strict";

  const CLAVE = "clipper.borrados";
  const CLAVE_PUB = "clipper.publicados";
  const TTL_POR_DEFECTO = 24;           // solo si el JSON no trae ttl_horas
  const EDAD_MAX_DEFECTO = 24;          // idem con edad_max_horas
  const PENALIZACION_DEFECTO = 0.5;     // idem con penalizacion_estimada
  const REFRESCO_DATOS = 5 * 60 * 1000; // el radar publica una vez por ronda
  const REFRESCO_RELOJ = 60 * 1000;     // para que caduquen sin recargar
  const DIAS_REGISTRO = 90;             // cuanto se guarda lo que ya subiste

  let feed = {
    clips: [], actualizado_en: null,
    ttl_horas: TTL_POR_DEFECTO, edad_max_horas: EDAD_MAX_DEFECTO,
    penalizacion: PENALIZACION_DEFECTO,
  };

  // Los dos relojes de un clip, en milisegundos: cuando se le acaba el rato en
  // la web y cuando cumple la edad maxima. Manda el que venza antes, igual que
  // en web_feed._vigente. El de la edad es el que evita que un clip que entro
  // con 20 h de vida siga aqui con casi dos dias encima.
  const caduca = (c) => Math.min(
    Date.parse(c.anadido_en) + feed.ttl_horas * 3600e3,
    Date.parse(c.creado_en) + feed.edad_max_horas * 3600e3
  );

  // --- Almacen local -----------------------------------------------------
  // No hay servidor donde guardar nada: la web es estatica. Todo esto vive en
  // localStorage, asi que no viaja entre el PC y el movil.
  const leer = (clave) => {
    try { return JSON.parse(localStorage.getItem(clave)) || {}; }
    catch (e) { return {}; }
  };
  const guardar = (clave, v) => {
    try { localStorage.setItem(clave, JSON.stringify(v)); } catch (e) {}
  };

  // Los borrados se podan a las 48h: pasado el TTL del feed el clip ya no
  // existe, y recordar que lo borraste deja de servir para nada.
  const podarBorrados = () => {
    const b = leer(CLAVE), corte = Date.now() - 48 * 3600e3;
    let cambio = false;
    for (const id of Object.keys(b)) {
      if (!(Date.parse(b[id]) >= corte)) { delete b[id]; cambio = true; }
    }
    if (cambio) guardar(CLAVE, b);
    return b;
  };

  // El registro de publicados es distinto: no guarda solo el id, guarda la
  // FILA ENTERA. Tiene que sobrevivir a que el clip caduque del feed a las
  // 24h, porque si no el CSV se quedaria siempre vacio.
  const podarPublicados = () => {
    const p = leer(CLAVE_PUB), corte = Date.now() - DIAS_REGISTRO * 24 * 3600e3;
    let cambio = false;
    for (const id of Object.keys(p)) {
      // El `p[id] &&` no sobra: si el localStorage trae basura de una version
      // anterior, sin el la pagina entera se cae con un TypeError.
      if (!(p[id] && Date.parse(p[id].publicado_en) >= corte)) {
        delete p[id];
        cambio = true;
      }
    }
    if (cambio) guardar(CLAVE_PUB, p);
    return p;
  };

  // --- Formato -----------------------------------------------------------
  const miles = (n) => Number(n || 0).toLocaleString("es-ES");
  const duracion = (ms) => {
    const m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60);
    return h + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
  };
  const esc = (s) => {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  };
  // Mismo criterio que digest.puntuacion en el radar: la velocidad estimada
  // no es comparable con la medida, asi que para ORDENAR va penalizada. El
  // numero que se enseña sigue siendo el de verdad.
  const puntuacion = (c) =>
    (c.velocidad || 0) * (c.fuente === "nuevo" ? feed.penalizacion : 1);

  // --- Pintado -----------------------------------------------------------
  function tarjeta(c, puesto, publicados) {
    const ahora = Date.now();
    const estimada = c.fuente === "nuevo";
    const publicada = !!publicados[c.id];
    const caducaEn = caduca(c) - ahora;
    const edad = ahora - Date.parse(c.creado_en);

    const el = document.createElement("article");
    el.className = "tarjeta" + (publicada ? " publicada" : "");
    el.dataset.id = c.id;
    el.innerHTML = [
      // La miniatura es el enlace principal: en movil se acierta con el pulgar
      // sin apuntar. El boton "Abrir clip" se queda para que quede explicito.
      '<a class="lienzo" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer"',
        ' aria-label="Abrir el clip de ' + esc(c.canal) + '">',
        c.miniatura ? '<img src="' + esc(c.miniatura) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '',
        '<span class="puesto">#' + puesto + '</span>',
        publicada ? '<span class="sello">subido</span>' : '',
        '<span class="velocidad ' + (estimada ? 'estimada' : '') + '">',
          (estimada ? '~' : '') + miles(Math.round(c.velocidad)) + ' v/h',
          '<span class="matiz">' + (estimada ? 'estimada' : 'medida') + '</span>',
        '</span>',
        c.duracion ? '<span class="duracion">' + Math.round(c.duracion) + 's</span>' : '',
      '</a>',
      '<div class="cuerpo">',
        '<div class="canal"><span>' + esc(c.canal) + '</span>',
          c.juego ? '<span class="juego">' + esc(c.juego) + '</span>' : '',
        '</div>',
        '<p class="titulo">' + esc(c.titulo) + '</p>',
        '<div class="meta">',
          '<span>' + miles(c.vistas) + ' vistas</span>',
          '<span>clip de hace ' + duracion(edad) + '</span>',
          '<span>caduca en ' + duracion(caducaEn) + '</span>',
        '</div>',
        '<div class="acciones">',
          '<a class="abrir" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">Abrir clip</a>',
          '<button class="subido" aria-pressed="' + publicada + '" title="Marcar como ya subido a ClipperoTV">',
            (publicada ? 'Subido' : 'Marcar'),
          '</button>',
          '<button class="borrar" title="Quitar de la web">Borrar</button>',
        '</div>',
      '</div>'
    ].join('');

    el.querySelector(".borrar").addEventListener("click", () => {
      const b = leer(CLAVE);
      b[c.id] = new Date().toISOString();
      guardar(CLAVE, b);
      el.classList.add("saliendo");
      setTimeout(pintar, 180);
    });

    el.querySelector(".subido").addEventListener("click", () => {
      const p = leer(CLAVE_PUB);
      if (p[c.id]) {
        delete p[c.id];
      } else {
        // Se copia la fila entera, no el id: es lo que hace que el registro
        // siga existiendo cuando el clip ya haya caducado del feed.
        p[c.id] = {
          publicado_en: new Date().toISOString(),
          canal: c.canal, juego: c.juego || "", titulo: c.titulo, url: c.url,
          duracion: c.duracion || 0, vistas: c.vistas,
          velocidad: c.velocidad, fuente: c.fuente, creado_en: c.creado_en,
        };
      }
      guardar(CLAVE_PUB, p);
      pintar();
    });

    if (gh()) {
      const v = document.createElement("div");
      v.className = "vertical";
      v.dataset.id = c.id;
      el.querySelector(".cuerpo").appendChild(v);
      rellenarVertical(v, c);
    }
    return el;
  }

  // --- El registro, en CSV -----------------------------------------------
  // El radar elige los clips por vistas/hora EN TWITCH. Que eso prediga algo
  // en TikTok o en X no lo sabe nadie todavia. Las cuatro columnas vacias del
  // final son justo para eso: rellenalas a mano y en un mes sabras si la
  // metrica es la correcta o si lo que funciona es otra cosa.
  const COLUMNAS = [
    "publicado_en", "canal", "juego", "duracion_s", "titulo", "url",
    "vistas_twitch", "velocidad_vh", "fuente", "creado_en",
    "views_tiktok", "views_reels", "views_shorts", "views_x",
  ];

  function descargarRegistro() {
    const p = podarPublicados();
    const filas = Object.values(p)
      .sort((a, b) => Date.parse(b.publicado_en) - Date.parse(a.publicado_en))
      .map((r) => [
        r.publicado_en, r.canal, r.juego, r.duracion, r.titulo, r.url,
        r.vistas, r.velocidad, r.fuente, r.creado_en, "", "", "", "",
      ]);
    const celda = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const csv = [COLUMNAS, ...filas].map((f) => f.map(celda).join(",")).join("\r\n");

    // El BOM es para Excel: sin el, abre el CSV en la codificacion del sistema
    // y los acentos salen rotos.
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "clippero-registro-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function enlaceSub(texto, alPulsar) {
    const b = document.createElement("button");
    b.textContent = texto;
    b.addEventListener("click", alPulsar);
    return b;
  }

  function pintar() {
    const salida = document.getElementById("salida");
    const sub = document.getElementById("sub");
    const borrados = podarBorrados();
    const publicados = podarPublicados();
    const ahora = Date.now();

    // Doble filtro de caducidad: el radar poda el JSON en cada ronda, pero
    // una pestana abierta desde ayer tiene que caducarlos por su cuenta.
    const vivos = feed.clips
      .filter((c) => caduca(c) > ahora)
      // Los ya subidos al final, y dentro de cada grupo por velocidad.
      .sort((a, b) => {
        const pa = publicados[a.id] ? 1 : 0, pb = publicados[b.id] ? 1 : 0;
        return pa - pb || puntuacion(b) - puntuacion(a);
      });
    const visibles = vivos.filter((c) => !borrados[c.id]);
    const ocultos = vivos.length - visibles.length;
    const pendientes = visibles.filter((c) => !publicados[c.id]).length;
    const enRegistro = Object.keys(publicados).length;

    sub.innerHTML = '<span><span class="punto"></span> ' + pendientes + ' sin subir' +
      (visibles.length - pendientes ? ' de ' + visibles.length : '') + '</span>' +
      (feed.actualizado_en
        ? '<span>ultima ronda hace ' + duracion(ahora - Date.parse(feed.actualizado_en)) + '</span>'
        : '');
    if (ocultos) {
      sub.appendChild(enlaceSub(
        "restaurar " + ocultos + " borrado" + (ocultos > 1 ? "s" : ""),
        () => { guardar(CLAVE, {}); pintar(); }
      ));
    }
    if (enRegistro) {
      sub.appendChild(enlaceSub(
        "descargar registro (" + enRegistro + ")", descargarRegistro
      ));
    }
    if (gh()) sub.appendChild(enlaceSub("ajustes", pintarAjustes));

    salida.innerHTML = "";
    if (!visibles.length) {
      salida.innerHTML = vivos.length
        ? '<div class="aviso"><h2>Los has borrado todos</h2><p>Vuelve tras la proxima ronda, o restaura los borrados ahi arriba.</p></div>'
        : '<div class="aviso"><h2>Todavia no hay clips</h2><p>La web se llena cuando el radar termina una ronda.</p></div>';
      return;
    }
    const rejilla = document.createElement("div");
    rejilla.className = "rejilla";
    visibles.forEach((c, i) => rejilla.appendChild(tarjeta(c, i + 1, publicados)));
    salida.appendChild(rejilla);
  }

  // --- Vertical: lanzar el workflow de GitHub Actions ---------------------
  // La web es publica, pero lanzar el workflow exige un token de GitHub que
  // solo existe en el localStorage de tus navegadores. Sin el, ni se pinta el
  // boton; y aunque alguien llamara a la API a mano, GitHub lo rechazaria.
  const CLAVE_GH = "clipper.github";          // { token, repo }
  const CLAVE_TRABAJOS = "clipper.trabajos";  // { peticion: { ... } }
  const REPO_DEFECTO = "Aznar7/clipper-lite";
  const WORKFLOW = "vertical.yml";
  const LAYOUTS = [
    ["auto", "Layout automático"], ["stacked", "Cam + juego"], ["fullcam", "Cámara completa"],
    ["grid", "Cuadrícula"], ["gameplay", "Solo juego"],
  ];
  const SONDEO = 15 * 1000;

  const gh = () => {
    const g = leer(CLAVE_GH);
    return g.token ? { token: g.token, repo: g.repo || REPO_DEFECTO } : null;
  };

  // Lo que estas escribiendo en el formulario de cada tarjeta. Vive en memoria
  // para que el repintado de cada minuto no te lo borre.
  const abiertos = {};

  const ERRORES_API = {
    401: "El token no vale o ha caducado.",
    403: "El token no tiene permiso de Actions (lectura y escritura) sobre el repo.",
    404: "No encuentro el repo o el workflow vertical.yml. ¿Está bien el repo y subido el workflow?",
    422: "GitHub ha rechazado los datos (¿el workflow está en la rama main?).",
  };

  async function api(ruta, opciones = {}) {
    const g = gh();
    if (!g) throw new Error("Falta el token de GitHub.");
    const r = await fetch("https://api.github.com/repos/" + g.repo + ruta, {
      ...opciones,
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: "Bearer " + g.token,
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opciones.body ? { "Content-Type": "application/json" } : {}),
      },
    });
    if (!r.ok) throw new Error(ERRORES_API[r.status] || "GitHub ha respondido " + r.status + ".");
    return r.status === 204 ? null : r.json();
  }

  const podarTrabajos = () => {
    const t = leer(CLAVE_TRABAJOS), corte = Date.now() - 24 * 3600e3;
    for (const p of Object.keys(t)) {
      if (!(t[p] && Date.parse(t[p].lanzado_en) >= corte)) delete t[p];
    }
    guardar(CLAVE_TRABAJOS, t);
    return t;
  };

  async function lanzar({ url, texto, layout, clip, etiqueta }) {
    // La API de dispatch no devuelve el id de la ejecucion. Esta "peticion" va
    // en el titulo de la ejecucion (run-name del workflow) y es lo que usa
    // vigilar() para encontrarla.
    const peticion = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await api("/actions/workflows/" + WORKFLOW + "/dispatches", {
      method: "POST",
      body: JSON.stringify({ ref: "main", inputs: { url, texto: texto || "", layout: layout || "auto", peticion } }),
    });
    const t = podarTrabajos();
    t[peticion] = { clip: clip || null, etiqueta, url, lanzado_en: new Date().toISOString(), estado: "enviado" };
    guardar(CLAVE_TRABAJOS, t);
    refrescarTrabajos();
    vigilar();
  }

  const terminado = (j) => j.estado === "completed";

  let temporizador = null;
  async function vigilar() {
    clearTimeout(temporizador);
    const t = podarTrabajos();
    const activos = Object.keys(t).filter((p) => !terminado(t[p]));
    if (!activos.length || !gh()) return;
    try {
      const d = await api("/actions/workflows/" + WORKFLOW + "/runs?event=workflow_dispatch&per_page=30");
      for (const p of activos) {
        const j = t[p];
        const run = (d.workflow_runs || []).find((r) => r.display_title === "vertical " + p);
        if (run) {
          j.estado = run.status;
          j.conclusion = run.conclusion;
          j.url_run = run.html_url;
          j.empezado_en = run.run_started_at;
        } else if (Date.now() - Date.parse(j.lanzado_en) > 10 * 60e3) {
          // GitHub tarda unos segundos en dar de alta la ejecucion, pero no 10 min.
          j.estado = "completed";
          j.conclusion = "perdido";
        }
      }
      guardar(CLAVE_TRABAJOS, t);
    } catch (e) {
      // Un fallo de red puntual no es motivo para dejar de mirar.
    }
    refrescarTrabajos();
    if (Object.values(t).some((j) => !terminado(j))) temporizador = setTimeout(vigilar, SONDEO);
  }

  function estadoTrabajo(j) {
    const ver = j.url_run ? ' <a href="' + esc(j.url_run) + '" target="_blank" rel="noopener noreferrer">ver</a>' : "";
    let clase, texto;
    if (!terminado(j)) {
      clase = "curso";
      texto = j.estado === "in_progress"
        ? "Editando… " + duracion(Date.now() - Date.parse(j.empezado_en || j.lanzado_en))
        : "En cola…";
    } else if (j.conclusion === "success") {
      clase = "bien"; texto = "Enviado a Telegram ✓";
    } else if (j.conclusion === "skipped") {
      clase = "mal"; texto = "Rechazado: solo puede lanzarlo el dueño del repo";
    } else if (j.conclusion === "perdido") {
      clase = "mal"; texto = "No encuentro la ejecución en GitHub";
    } else {
      clase = "mal"; texto = "Ha fallado";
    }
    return '<span class="estado ' + clase + '">' + texto + ver + '</span>';
  }

  const ultimoDe = (t, clip) => Object.values(t)
    .filter((j) => j.clip === clip)
    .sort((a, b) => Date.parse(b.lanzado_en) - Date.parse(a.lanzado_en))[0];

  const opcionesLayout = (elegido) => LAYOUTS
    .map(([v, n]) => '<option value="' + v + '"' + (v === elegido ? " selected" : "") + ">" + n + "</option>")
    .join("");

  // El bloque "Vertical" de una tarjeta: o el formulario, o el boton con el
  // estado de la ultima vez que se lanzo ese clip.
  function rellenarVertical(div, c) {
    const f = abiertos[c.id];
    if (f) {
      div.innerHTML =
        '<div class="formulario">' +
          '<input class="v-texto" maxlength="120" placeholder="Texto gancho (opcional)" value="' + esc(f.texto) + '">' +
          '<div class="fila"><select class="v-layout">' + opcionesLayout(f.layout) + '</select></div>' +
          '<div class="fila"><button class="lanzar">Montar vertical</button>' +
          '<button class="secundario v-cancelar">Cancelar</button></div>' +
          (f.error ? '<span class="estado mal">' + esc(f.error) + '</span>' : '') +
        '</div>';
      const texto = div.querySelector(".v-texto"), layout = div.querySelector(".v-layout");
      texto.addEventListener("input", () => { f.texto = texto.value; });
      layout.addEventListener("change", () => { f.layout = layout.value; });
      div.querySelector(".v-cancelar").addEventListener("click", () => {
        delete abiertos[c.id];
        rellenarVertical(div, c);
      });
      const boton = div.querySelector(".lanzar");
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        boton.textContent = "Lanzando…";
        try {
          await lanzar({ url: c.url, texto: f.texto, layout: f.layout, clip: c.id, etiqueta: c.canal });
          delete abiertos[c.id];
        } catch (e) {
          f.error = e.message;
        }
        rellenarVertical(div, c);
      });
      return;
    }
    const j = ultimoDe(leer(CLAVE_TRABAJOS), c.id);
    div.innerHTML = (j ? '<div style="margin-bottom:8px">' + estadoTrabajo(j) + '</div>' : '') +
      (j && !terminado(j) ? '' : '<button>' + (j ? 'Montar otra vez' : 'Editar en vertical') + '</button>');
    const boton = div.querySelector("button");
    if (boton) boton.addEventListener("click", () => {
      abiertos[c.id] = { texto: "", layout: "auto" };
      rellenarVertical(div, c);
      div.querySelector(".v-texto").focus();
    });
  }

  // Actualiza estados sin repintar las tarjetas (y sin perder lo escrito).
  function refrescarTrabajos() {
    const t = leer(CLAVE_TRABAJOS);
    document.querySelectorAll(".vertical[data-id]").forEach((div) => {
      const c = feed.clips.find((x) => x.id === div.dataset.id);
      if (c && !abiertos[c.id]) rellenarVertical(div, c);
    });
    const lista = document.getElementById("trabajos");
    if (!lista) return;
    const todos = Object.values(t).sort((a, b) => Date.parse(b.lanzado_en) - Date.parse(a.lanzado_en));
    lista.innerHTML = todos.map((j) =>
      '<li><span class="nombre">' + esc(j.etiqueta || j.url) + ' · hace ' +
      duracion(Date.now() - Date.parse(j.lanzado_en)) + '</span>' + estadoTrabajo(j) + '</li>'
    ).join("");
  }

  function pintarAjustes() {
    const panel = document.getElementById("ajustes");
    const g = leer(CLAVE_GH);
    panel.hidden = false;
    panel.innerHTML =
      '<h2>Ajustes: editar en vertical</h2>' +
      '<p>Pega un token de GitHub <i>fine-grained</i> con acceso solo al repo del radar y el permiso ' +
      '<b>Actions: Read and write</b>. Se guarda únicamente en este navegador.</p>' +
      '<div class="fila"><input id="aj-token" type="password" autocomplete="off" placeholder="github_pat_…" value="' + esc(g.token) + '">' +
      '<input id="aj-repo" placeholder="usuario/repo" value="' + esc(g.repo || REPO_DEFECTO) + '"></div>' +
      '<div class="fila"><button id="aj-guardar">Guardar y probar</button>' +
      '<button id="aj-olvidar" class="secundario">Olvidar token</button>' +
      '<button id="aj-cerrar" class="secundario">Cerrar</button></div>' +
      '<span id="aj-estado" class="estado"></span>';
    const estado = document.getElementById("aj-estado");
    const avisar = (clase, texto) => { estado.className = "estado " + clase; estado.textContent = texto; };

    document.getElementById("aj-guardar").addEventListener("click", async () => {
      const token = document.getElementById("aj-token").value.trim();
      const repo = document.getElementById("aj-repo").value.trim() || REPO_DEFECTO;
      if (!token) return avisar("mal", "Falta el token.");
      guardar(CLAVE_GH, { token, repo });
      avisar("curso", "Probando…");
      try {
        await api("/actions/workflows/" + WORKFLOW);
        avisar("bien", "Conectado ✓");
        activarVertical();
      } catch (e) {
        avisar("mal", e.message);
      }
    });
    document.getElementById("aj-olvidar").addEventListener("click", () => {
      guardar(CLAVE_GH, {});
      cerrarAjustes();
      activarVertical();
    });
    document.getElementById("aj-cerrar").addEventListener("click", cerrarAjustes);
  }

  function cerrarAjustes() {
    document.getElementById("ajustes").hidden = true;
    if (location.hash === "#ajustes") history.replaceState(null, "", location.pathname + location.search);
  }

  function pintarLanzador() {
    const panel = document.getElementById("lanzador");
    panel.innerHTML =
      '<h2>Vertical desde un enlace</h2>' +
      '<div class="fila"><input id="la-url" type="url" placeholder="https://clips.twitch.tv/…">' +
      '<input id="la-texto" maxlength="120" placeholder="Texto gancho (opcional)"></div>' +
      '<div class="fila"><select id="la-layout" style="flex:1 1 160px;width:auto">' + opcionesLayout("auto") + '</select>' +
      '<button id="la-lanzar" class="lanzar">Montar vertical</button></div>' +
      '<span id="la-error" class="estado mal"></span>' +
      '<ul id="trabajos" class="trabajos"></ul>';
    const boton = document.getElementById("la-lanzar");
    boton.addEventListener("click", async () => {
      const campo = document.getElementById("la-url");
      const error = document.getElementById("la-error");
      const url = campo.value.trim();
      error.textContent = "";
      if (!/^https?:\/\//.test(url)) { error.textContent = "Pega el enlace completo del clip."; return; }
      boton.disabled = true;
      try {
        await lanzar({
          url, etiqueta: url.replace(/^https?:\/\/(www\.)?/, ""),
          texto: document.getElementById("la-texto").value,
          layout: document.getElementById("la-layout").value,
        });
        campo.value = "";
        document.getElementById("la-texto").value = "";
      } catch (e) {
        error.textContent = e.message;
      }
      boton.disabled = false;
    });
  }

  // Enseña u oculta todo lo de vertical segun haya token, y repinta.
  function activarVertical() {
    const panel = document.getElementById("lanzador");
    if (gh()) {
      if (panel.hidden) { pintarLanzador(); panel.hidden = false; }
      vigilar();
    } else {
      panel.hidden = true;
      panel.innerHTML = "";
    }
    if (feed.actualizado_en) pintar();  // antes de la primera carga no hay nada que pintar
    refrescarTrabajos();
  }

  // pintar() reconstruye las tarjetas. Si estas escribiendo en una, se espera.
  const repintar = () => {
    const foco = document.activeElement;
    if (foco && foco.closest && foco.closest(".formulario, .panel")) return;
    pintar();
  };

  // --- Datos -------------------------------------------------------------
  async function cargar() {
    try {
      // Pages cachea con ganas; sin romper la cache verias la ronda de ayer.
      const r = await fetch("clips.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      feed = {
        clips: Array.isArray(d.clips) ? d.clips : [],
        actualizado_en: d.actualizado_en || null,
        ttl_horas: d.ttl_horas || TTL_POR_DEFECTO,
        edad_max_horas: d.edad_max_horas || EDAD_MAX_DEFECTO,
        penalizacion: d.penalizacion_estimada || PENALIZACION_DEFECTO,
      };
      repintar();
    } catch (e) {
      document.getElementById("sub").innerHTML = "";
      document.getElementById("salida").innerHTML =
        '<div class="aviso"><h2>No se pudo leer <code>clips.json</code></h2>' +
        '<p>Si el radar aun no ha publicado ninguna ronda, es lo esperado.</p></div>';
    }
  }

  // #ajustes en la URL abre el panel del token. Es la unica puerta de entrada
  // cuando aun no hay token, y a proposito no hay ningun enlace visible a ella.
  const mirarAjustes = () => { if (location.hash === "#ajustes") pintarAjustes(); };
  window.addEventListener("hashchange", mirarAjustes);
  mirarAjustes();
  activarVertical();

  cargar();
  setInterval(cargar, REFRESCO_DATOS);
  setInterval(repintar, REFRESCO_RELOJ);
  // Al volver a la pestana se recarga: en el movil es el caso normal, porque
  // el navegador congela la pagina en cuanto te vas a otra app. Y se vuelve a
  // mirar como van los verticales, que el sondeo se congela con ella.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { cargar(); vigilar(); }
  });
})();
</script>
</body>
</html>
